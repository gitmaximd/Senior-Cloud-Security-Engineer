defaults:
  level_1_ou: &level_1_ou
    parent: root
    level: 1
    scps: []
  workloads_child_ou: &workloads_child_ou
    parent: workloads
    level: 2
    scps: []
root:
  scps:
    - deny-leave-org

organizational_units:
  - key: sandbox
    <<: *level_1_ou
    name: Sandbox

  - key: security
    <<: *level_1_ou
    name: Security

  - key: infrastructure
    <<: *level_1_ou
    name: Infrastructure

  - key: workloads
    <<: *level_1_ou
    name: Workloads

  - key: prod
    <<: *workloads_child_ou
    name: Prod
    scps:
      - prod-guardrails

  - key: staging
    <<: *workloads_child_ou
    name: Staging
