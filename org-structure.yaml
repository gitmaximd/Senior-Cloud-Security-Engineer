defaults:
  level_1_ou: &level_1_ou
    parent: root
    level: 1
    scps:
      - deny-disabling-cloudtrail
  workloads_child_ou: &workloads_child_ou
    parent: workloads
    level: 2
    scps:
      - deny-disabling-cloudtrail
root:
  scps:
    - deny-leave-org

organizational_units:
  - key: sandbox
    <<: *level_1_ou
    name: Sandbox
    scps: []

  - key: security
    <<: *level_1_ou
    name: Security

  - key: infrastructure
    <<: *level_1_ou
    name: Infrastructure

  - key: workloads
    <<: *level_1_ou
    name: Workloads

  - key: prod
    <<: *workloads_child_ou
    name: Prod
    scps:
      - prod-guardrails

  - key: staging
    <<: *workloads_child_ou
    name: Staging

  - key: policy-staging
    <<: *level_1_ou
    name: Policy-Staging

accounts:
  - key: audit-logs
    id: "025277631194"
    scps:
      - protect-audit-logs-s3
